<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Update Ride #{{ ride.id }}</title>
  </head>

  <body>
    <h1>Update Ride #{{ ride.id }}</h1>

    <form method="POST">
      {% csrf_token %} {{ form.as_p }}

      <button type="submit">Save Changes</button>
    </form>

    <a href="{% url 'ride_detail' ride.id %}">Back to Ride Details</a>
  </body>
</html>
